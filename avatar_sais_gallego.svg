<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Geometric Tech Center Shape -->
  <polygon points="250,90 370,160 370,300 250,370 130,300 130,160" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.35" />

  <!-- Central Modern Monogram S / G -->
  <!-- S Symbol Styled as Digital Node -->
  <path d="M 310 170 C 270 135, 190 145, 185 195 C 180 240, 315 230, 315 285 C 315 340, 220 355, 180 315" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <path d="M 310 170 C 270 135, 190 145, 185 195 C 180 240, 315 230, 315 285 C 315 340, 220 355, 180 315" 
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Futuristic Corner Dots / Nodes -->
  <circle cx="250" cy="90" r="7" fill="#38bdf8" />
  <circle cx="370" cy="160" r="7" fill="#2dd4bf" />
  <circle cx="370" cy="300" r="7" fill="#38bdf8" />
  <circle cx="250" cy="370" r="7" fill="#2dd4bf" />
  <circle cx="130" cy="300" r="7" fill="#38bdf8" />
  <circle cx="130" cy="160" r="7" fill="#2dd4bf" />

  <!-- Brand Typography -->
  <text x="250" y="420" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">SAIS GALLEGO</text>
  <text x="250" y="448" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="3">DIGITAL STUDIO</text>
</svg>
